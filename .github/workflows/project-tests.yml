name: Project Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "release/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - dev
  schedule:
    - cron: "17 19 * * *"

jobs:
  node-unit-and-contracts:
    name: node unit and API contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit and component tests
        run: pnpm test:frontend

      - name: Collector unit tests
        run: pnpm test:collector

      - name: API contract tests
        run: pnpm test:contracts

  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Backend unit tests
        run: pnpm test:backend

  backend-integration:
    name: backend PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trademind
          POSTGRES_PASSWORD: trademind
          POSTGRES_DB: trademind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: PostgreSQL migration tests
        env:
          TEST_DATABASE_URL: postgres://trademind:trademind@127.0.0.1:5432/trademind_test?sslmode=disable
        run: pnpm test:db

      - name: Redis queue tests
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm test:redis
