# TradeMind staging Nginx — single host admin + API path prefix

upstream trademind_api_staging {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl http2;
    server_name staging.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;

    root /var/www/trademind-staging/admin/dist;
    index index.html;
    client_max_body_size 20m;

    location ~ ^/api/v1/products/[^/]+/ai/ozon-attribute-suggestions$ {
        proxy_pass http://trademind_api_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://trademind_api_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        proxy_pass http://trademind_api_staging;
    }

    location /health/ {
        proxy_pass http://trademind_api_staging;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
